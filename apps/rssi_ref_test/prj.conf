CONFIG_BT=y
CONFIG_BT_OBSERVER=y

# Same controller TX power setting as the HCI firmware under test, so the
# only variable between the two is the firmware/stack itself.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Log RSSI over RTT (J-Link), leaving both UARTs untouched.
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_UART_CONSOLE=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
