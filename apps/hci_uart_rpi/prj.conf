CONFIG_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_H4=y
CONFIG_BT_HCI_RAW_H4_ENABLE=y
CONFIG_BT_MAX_CONN=16

# NOTE: this NCS/Zephyr version has no assignable CONFIG_BT_CTLR symbol
# (Kconfig error: "undefined symbol BT_CTLR"). The umbrella symbol is now
# the hidden CONFIG_HAS_BT_CTLR, auto-selected by whichever link-layer
# implementation is active; it is not user-settable. For nrf52840dk/
# nrf52840 in this tree the active controller is the Nordic SoftDevice
# Controller (DT node bt_hci_sdc, chosen as zephyr,bt-hci), selected
# automatically because DT_HAS_NORDIC_BT_HCI_SDC_ENABLED and
# SOC_SERIES_NRF52 are true - no prj.conf entry needed to enable it.
CONFIG_BT_CTLR_ASSERT_HANDLER=y

# CONFIG_BT_OBSERVER has no default-y-if-BT_HCI_RAW (unlike BT_CENTRAL/
# BT_PERIPHERAL): without it, passive scanning is not even compiled in,
# and CONFIG_BT_CTLR_SDC_SCAN_BUFFER_COUNT below stays inert (it depends
# on BT_OBSERVER).
CONFIG_BT_OBSERVER=y

# BT_CENTRAL/BT_PERIPHERAL both have default-y-if-BT_HCI_RAW already, so
# this is technically redundant, but made explicit: this firmware covers
# passive scan monitoring (Observer), the host (BlueZ) initiating GATT
# connections to discovered devices (Central), advertising so the host
# can be discovered (Broadcaster), and accepting incoming GATT
# connections (Peripheral).
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y

# Default TX power at boot: +8 dBm, the maximum the bare nRF52840 RADIO
# peripheral can produce (confirmed against the official register
# definition in nrf52840_bitfields.h - RADIO_TXPOWER_TXPOWER_Pos8dBm is
# the highest positive enumerator; there is no +9/+10 dBm on this chip).
# Previously left at the Kconfig default of 0 dBm.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Exposes the Zephyr/Nordic vendor-specific "Read/Write TX Power Level"
# HCI commands (opcodes 0xFC0F/0xFC0E) at runtime, per connection/role
# handle. Without this, TX power is fixed at build time and those VS
# commands are rejected by the controller as Unknown HCI Command
# (status 0x01) - confirmed on hardware. Needed because BlueZ manages
# GATT connections to discovered devices and may want to tune TX power
# per link (range vs. power trade-off) rather than live with one fixed
# value for everything; also relevant once a future nRF21540 FEM
# iteration needs its own runtime power control up to +20/+21 dBm.
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y

# Sizing for continuous passive-scan monitoring (many devices, sustained
# LE Advertising Report stream), not generic/bursty usage:
#
# Controller-internal scan buffers (SoftDevice Controller, the active
# controller for nrf52840dk/nrf52840 in this NCS tree via the bt_hci_sdc
# DT node). These hold incoming packets/advertising reports before they
# become HCI events queued for the H4 UART driver. Raised from the
# default of 3 to the maximum of 20 to absorb bursts of overlapping
# adverts from many nearby devices without the controller dropping
# reports; cost is a few KB of RAM (~255 B/buffer worst case).
CONFIG_BT_CTLR_SDC_SCAN_BUFFER_COUNT=20

# Host-side HCI event RX queue, matched to the controller buffer count
# above per the sample's own guidance ("adjust to match Controller
# values"). This is the last stage before events are drained onto the
# UART; at the default of 10 it is the first thing to overflow under a
# sustained multi-device advertising burst. Raised to the Kconfig
# maximum (255) since this firmware's whole purpose is absorbing bursty
# advertising traffic, and the extra RAM (up to ~255 x 255 B if events
# are max-sized) is cheap compared to silently losing reports.
CONFIG_BT_BUF_EVT_RX_COUNT=255

# Maximum HCI event buffer length: raised to 255 (from the 68-byte
# default that applies without BT_EXT_ADV) so extended-advertising
# reports (long AD payloads) are never truncated.
CONFIG_BT_BUF_EVT_RX_SIZE=255
